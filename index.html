<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="실제 행사 부스를 선택하고 전시장 통로를 따라 방문 순서를 계산하세요.">
  <title>부스패스 · 박람회 동선</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="page-header">
    <h1>부스패스</h1>
    <button id="share" type="button" disabled>동선 링크 복사</button>
  </header>
  <main>
    <section class="event-settings" aria-label="행사 및 출발점">
      <label>행사<select id="event"></select></label>
      <label>출발점<select id="start"></select></label>
      <label class="inline-check"><input id="return" type="checkbox"> 출발점으로 돌아오기</label>
      <p id="event-info"></p>
    </section>
    <div class="planner">
      <section class="booth-panel" aria-labelledby="booth-title">
        <div class="section-heading"><h2 id="booth-title">부스 선택</h2><button id="clear" type="button">선택 해제</button></div>
        <div class="mode" aria-label="선택 방식">
          <button id="manual" type="button" aria-pressed="true">직접 고르기</button>
          <button id="recommend" type="button" aria-pressed="false">추천받기</button>
        </div>
        <form id="recommend-form" hidden>
          <div class="recommend-fields">
            <label>방문할 개수<input id="count" type="number" inputmode="numeric" min="1" value="6" required></label>
            <label>추천 기준<select id="priority"></select></label>
            <label>관심 분야<select id="interest"></select></label>
          </div>
          <button type="submit">추천하고 동선 만들기</button>
          <p id="recommend-note"></p>
        </form>
        <div class="search-fields">
          <input id="search" type="search" placeholder="부스 이름 또는 번호" aria-label="부스 이름 또는 번호 검색">
          <label class="inline-check"><input id="only-selected" type="checkbox"> 선택만</label>
        </div>
        <p id="results" class="results"></p>
        <div id="booths" class="booth-list" aria-label="부스 목록"></div>
        <div class="selection">
          <span id="selected-count" aria-live="polite">0곳 선택</span>
          <button id="plan" class="primary" type="button" disabled>동선 만들기</button>
        </div>
      </section>
      <section class="map-panel" aria-labelledby="map-title">
        <div class="section-heading"><h2 id="map-title">지도</h2>
          <div class="map-controls" aria-label="지도 크기">
            <button id="zoom-out" type="button" aria-label="지도 축소">−</button>
            <button id="zoom-in" type="button" aria-label="지도 확대">+</button>
            <button id="fit" type="button">전체 보기</button>
          </div>
        </div>
        <div id="map-viewport" class="map-viewport" tabindex="0" aria-label="전시장 지도. 확대 후 스크롤하여 이동할 수 있습니다.">
          <svg id="map" role="img" aria-labelledby="map-svg-title map-description"></svg>
        </div>
        <div class="map-caption"><span id="map-status">지도에서 부스를 눌러 선택할 수 있습니다.</span><span id="sources"></span></div>
        <section class="route-panel" aria-labelledby="route-title">
          <div class="section-heading"><h2 id="route-title">방문 순서</h2><button type="button" id="replan" hidden>현재 부스에서 다시 계산</button></div>
          <div id="route" aria-live="polite"></div>
        </section>
      </section>
    </div>
  </main>
  <div id="status" role="status" aria-live="polite"></div>
</body>
</html>
